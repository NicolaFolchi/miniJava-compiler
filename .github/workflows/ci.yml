name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build WAR
        run: mvn --batch-mode clean package

      - name: Build container
        run: docker build -t minijava-compiler .

      - name: Run smoke tests
        run: |
          docker run --rm -d --name minijava-smoke -p 8080:8080 minijava-compiler
          trap 'docker stop minijava-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://localhost:8080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs minijava-smoke
              exit 1
            fi
            sleep 2
          done
          scripts/smoke-test.sh http://localhost:8080
